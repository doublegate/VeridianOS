# Project build settings, tracked so that CI and fresh clones build with the
# same flags (the rest of .cargo/ is a local Cargo home and stays ignored).
# Only per-target flags live here: every build names its target explicitly
# (build-kernel.sh, the gate, CI), and a command without --target builds for
# the host, as CI's host checks expect.

[target.x86_64-veridian]
rustflags = ["-C", "code-model=kernel", "-C", "relocation-model=static"]

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "relocation-model=static", "-Z", "ub-checks=no"]
